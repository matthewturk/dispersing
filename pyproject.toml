[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "Cython>=3.0",
    "numpy>=1.23",
]
build-backend = "setuptools.build_meta"

[project]
name = "dispersing"
version = "0.1.0"
description = "A game asset extractor for The Summoning"
readme = "README.rst"
authors = [{ name = "Matthew Turk", email = "matthewturk@gmail.com" }]
license = "BSD-3-Clause"
requires-python = ">=3.10"
keywords = ["dispersing", "games", "the-summoning"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "ipython>=8.0",
    "ipywidgets>=7.6",
    "kaitaistruct>=0.9",
    "numpy>=1.23",
    "packaging>=21.0",
    "pandas>=1.5",
    "pillow>=9.0",
]

[project.scripts]
dispersing = "dispersing.cli:main"

[project.urls]
Homepage = "https://github.com/matthewturk/dispersing"
Documentation = "https://dispersing.readthedocs.io"

[dependency-groups]
dev = [
    "pre-commit>=3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "sphinx>=7.0",
]

[tool.setuptools]
# setup.py declares the Cython extension; all package metadata lives here.
include-package-data = true

[tool.setuptools.packages.find]
include = ["dispersing*"]

[tool.setuptools.package-data]
dispersing = ["ksy_files/*.ksy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["dispersing"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "docs",
    "dispersing/kaitai_parsers",
]
extend-exclude = ["*.pyx"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["dispersing"]
